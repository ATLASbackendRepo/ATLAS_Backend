name: "ATLAS"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    container_name: Atlas_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./sql-backups:/var/opt/mssql/backup

  seq:
   image: datalust/seq:latest
   container_name: Atlas_seq
   restart: always
   environment:
     ACCEPT_EULA: "Y"
     SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
   ports:
     - "5341:80"
   volumes:
     - seq_data:/data
  
  atlas:
    image: ${DOCKER_REGISTRY-}atlas
    restart: always
    build:
      context: .
      dockerfile: ATLAS/Dockerfile
    depends_on:
      - sqlserver
      - seq
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ATLAS;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Seq__ServerUrl=http://seq:80

volumes:
  sql_data:
  seq_data: