name: "ATLAS"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    container_name: Atlas_sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "127.0.0.1:1435:1433"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    volumes:
      - sql_data:/var/opt/mssql
      - ./sql-backups:/var/opt/mssql/backup


  seq:
    image: datalust/seq:2024.3
    restart: always
    container_name: Atlas_seq

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5341:80"

    volumes:
      - seq_data:/data


  atlas:
    image: ${DOCKER_REGISTRY-}atlas
    restart: always

    build:
      context: .
      dockerfile: ATLAS/Dockerfile

    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started

    environment:
      # The image is built for a production run. The Visual Studio debug
      # environment lives in docker-compose.vs.yml and is only applied when it
      # is named explicitly on the command line.
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ATLAS;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Seq__ServerUrl=http://seq:80
      - Jwt__Key=${Jwt__Key}
      - Discord__WebhookUrl=${Discord__WebhookUrl}
      - Discord__Enabled=true
      - Seed__FirstAdmin__AcademicId=${Seed__FirstAdmin__AcademicId}
      - Seed__FirstAdmin__Password=${Seed__FirstAdmin__Password}
      - Seed__FirstAdmin__FullName=${Seed__FirstAdmin__FullName}
      - Seed__Institution__Name=${Seed__Institution__Name}
      - Seed__Department__Name=${Seed__Department__Name}

    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/readyz || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


volumes:
  sql_data:
  seq_data: