name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The .slnx solution format requires SDK 9.0.200 or newer.
          # global.json pins the same feature band for local builds.
          dotnet-version: 9.0.x
      - run: dotnet restore ATLAS.slnx
      - run: dotnet build ATLAS.slnx --no-restore --configuration Release
      - run: dotnet test ATLAS.Tests/ATLAS.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"
